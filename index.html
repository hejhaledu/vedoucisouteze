<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#05072b">
<title>Artimo Manager – Vedoucí</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@800;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#05072b;
  --glass:rgba(255,255,255,.05);--glass2:rgba(255,255,255,.08);--glass3:rgba(255,255,255,.13);
  --stroke:rgba(255,255,255,.08);--stroke2:rgba(255,255,255,.14);
  --text:#f4f5fb;--text2:rgba(232,235,255,.62);--text3:rgba(232,235,255,.38);
  --accent:#f5d3a8;--ink:#05072b;--blue:#5b8cff;--green:#34c759;--red:#ff5a5f;--orange:#ff9f0a;--gray:#8e8e93;
  --shadow:0 10px 30px rgba(0,0,0,.35);
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Inter,Roboto,"Helvetica Neue",sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0}
button,input,select,textarea{font-family:inherit;color:inherit}
::selection{background:rgba(91,140,255,.4)}
*{scrollbar-width:thin;scrollbar-color:rgba(255,255,255,.14) transparent}
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:rgba(255,255,255,.12);border-radius:8px;border:2px solid transparent;background-clip:padding-box}
.hidden{display:none!important}
.dot{width:8px;height:8px;border-radius:50%;background:var(--gray);display:inline-block;flex:0 0 auto}
.dot.ok{background:var(--green)}.dot.wait{background:var(--orange)}.dot.bad{background:var(--red)}.dot.idle{background:#7d82a8}.dot.blue{background:var(--blue)}
.muted{color:var(--text2)}.faint{color:var(--text3)}
.row{display:flex;gap:8px;align-items:center}.row.wrap{flex-wrap:wrap}.grow{flex:1;min-width:0}.sp{flex:1}
.switch{position:relative;display:inline-block;width:36px;height:22px;flex:0 0 auto}
.switch input{opacity:0;width:0;height:0}
.switch span{position:absolute;inset:0;border-radius:11px;background:rgba(120,120,128,.36);transition:background .2s;cursor:pointer}
.switch span::after{content:"";position:absolute;left:2px;top:2px;width:18px;height:18px;border-radius:50%;background:#fff;box-shadow:0 2px 4px rgba(0,0,0,.3);transition:transform .2s}
.switch input:checked+span{background:var(--red)}
.switch input:checked+span::after{transform:translateX(14px)}
.badge{display:inline-flex;align-items:center;gap:5px;height:20px;padding:0 8px;border-radius:10px;font-size:11px;font-weight:600;white-space:nowrap}
.badge.open{background:rgba(52,199,89,.16);color:#5fe08a}
.badge.locked{background:rgba(255,159,10,.16);color:#ffb84d}
.badge.between{background:rgba(91,140,255,.18);color:#9db8ff}
.badge.done{background:rgba(245,211,168,.18);color:var(--accent)}
.badge.wait,.badge.free{background:rgba(255,255,255,.08);color:var(--text2)}
.badge.urgent{background:var(--red);color:#fff}
.badge.demo{background:var(--blue);color:#fff;letter-spacing:.06em}
.badge.type{background:rgba(255,255,255,.1);color:var(--text)}
.badge.type.health{background:rgba(255,90,95,.18);color:#ff9a9d}
.badge.type.tech{background:rgba(91,140,255,.2);color:#9db8ff}
.badge.type.floor{background:rgba(245,211,168,.18);color:var(--accent)}
.kicker{font-size:11px;font-weight:600;color:var(--text3);text-transform:uppercase;letter-spacing:.08em}
.dchips{display:flex;flex-wrap:wrap;gap:6px}
.dchip{display:inline-flex;align-items:center;gap:7px;height:32px;padding:0 12px;border-radius:16px;background:var(--glass2);color:var(--text2);font-weight:600;font-size:13px}
.dchip small{font-size:11px;font-weight:600;opacity:.75}
.dchip.done{background:rgba(52,199,89,.14);color:#5fe08a}
.dchip.cur{background:var(--accent);color:var(--ink);box-shadow:0 0 0 1px rgba(245,211,168,.4),0 6px 22px rgba(245,211,168,.18)}
.pulse{width:8px;height:8px;border-radius:50%;background:var(--ink);animation:pulse 1.6s infinite}
@keyframes pulse{50%{opacity:.25}}
@keyframes fade{from{opacity:0}}@keyframes pop{from{opacity:0;transform:scale(.97)}}
.credit{text-align:center;font-size:11px;color:var(--text3);padding:6px 0 18px;letter-spacing:.02em}
.nchip{display:inline-flex;align-items:center;justify-content:center;min-width:30px;height:24px;padding:0 7px;border-radius:7px;background:var(--glass2);font-weight:700;font-size:12px;font-variant-numeric:tabular-nums}
.nchip.miss{background:rgba(255,90,95,.16);color:#ff9a9d}
.bar{height:6px;border-radius:3px;background:rgba(255,255,255,.08);overflow:hidden}
.bar i{display:block;height:100%;border-radius:3px;background:var(--green);transition:width .3s}

body{font-family:var(--font);font-size:13px;color:var(--text);background:radial-gradient(1200px 700px at 0% -20%,#111766 0%,transparent 60%),radial-gradient(900px 600px at 110% 120%,#0d1250 0%,transparent 60%),var(--bg);background-attachment:fixed;min-height:100vh;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font-size:13px}
.logo{height:30px;width:auto;display:block}
.btn{height:30px;padding:0 12px;border-radius:8px;border:none;background:var(--glass2);color:var(--text);font-weight:600;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px;white-space:nowrap;transition:background .15s,transform .1s,opacity .15s}
.btn:hover:not(:disabled){background:var(--glass3)}
.btn:active:not(:disabled){transform:scale(.98)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.primary{background:var(--accent);color:var(--ink)}
.btn.primary:hover:not(:disabled){background:#f9dfbd}
.btn.blue{background:var(--blue);color:#fff}
.btn.danger{background:rgba(255,90,95,.14);color:#ff8a8d}
.btn.plain{background:transparent;color:var(--blue);padding:0 6px}
.btn.plain:hover:not(:disabled){background:rgba(91,140,255,.12)}
.btn.lg{height:38px;padding:0 18px;font-size:14px;border-radius:10px}
.btn.sm{height:24px;padding:0 8px;font-size:12px;border-radius:6px}
.btn.icon{width:24px;padding:0}
.btn.on{background:rgba(52,199,89,.18);color:#5fe08a}
input.in,select.in,textarea.in{height:30px;width:100%;padding:0 10px;border-radius:8px;border:1px solid transparent;background:rgba(255,255,255,.06);outline:none;transition:border-color .15s,box-shadow .15s}
textarea.in{height:auto;padding:8px 10px;resize:vertical;line-height:1.45}
.in:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(91,140,255,.25)}
.in::placeholder{color:var(--text3)}
select.in option{background:#11154a}
input[type=time]::-webkit-calendar-picker-indicator{filter:invert(1);opacity:.5}
.seg{display:inline-flex;background:rgba(255,255,255,.07);border-radius:9px;padding:2px;gap:2px}
.seg button{height:26px;padding:0 12px;border-radius:7px;border:none;background:transparent;color:var(--text2);font-weight:600;cursor:pointer;transition:background .15s,color .15s;display:inline-flex;align-items:center}
.seg button.on{background:rgba(255,255,255,.17);color:var(--text);box-shadow:0 1px 3px rgba(0,0,0,.35)}
.seg.lg button{height:30px;padding:0 16px;font-size:13px}
.chips{display:flex;flex-wrap:wrap;gap:5px}
.chip{height:26px;padding:0 11px;border-radius:13px;border:none;background:var(--glass2);color:var(--text2);font-size:12px;font-weight:600;cursor:pointer}
.chip.on{background:var(--blue);color:#fff}
.hint{font-size:12px;color:var(--text2);line-height:1.45;margin-top:4px}
.err{color:#ff8a8d;font-size:12px;margin-top:6px;min-height:14px}
.lbl{display:block;font-size:12px;color:var(--text2);margin:10px 0 4px;font-weight:500}
header{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:16px;padding:10px 20px;background:rgba(5,7,43,.72);backdrop-filter:saturate(160%) blur(20px);-webkit-backdrop-filter:saturate(160%) blur(20px);border-bottom:1px solid var(--stroke)}
.brand{font-family:"Outfit",var(--font);font-weight:900;font-size:17px;letter-spacing:.02em;line-height:1;white-space:nowrap}
.brand span{color:var(--accent)}
.brand small{display:block;font-family:var(--font);font-size:11px;font-weight:500;color:var(--text2);letter-spacing:0;margin-top:3px;max-width:240px;overflow:hidden;text-overflow:ellipsis}
.conn{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--text2);white-space:nowrap}
.clock{font-size:15px;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.badge-n{background:var(--red);color:#fff;border-radius:8px;font-size:10px;padding:1px 6px;margin-left:5px}
.wrap{max-width:1500px;margin:0 auto;padding:18px 20px}
.cols{display:grid;grid-template-columns:1fr 340px;gap:18px;align-items:start}
@media(max-width:1080px){.cols{grid-template-columns:1fr}header{flex-wrap:wrap;gap:10px}}
.stack{display:flex;flex-direction:column;gap:18px;min-width:0}
.card{background:var(--glass);border:1px solid var(--stroke);border-radius:14px;box-shadow:var(--shadow);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px)}
.card.pad{padding:18px}
.card.live{border-color:rgba(245,211,168,.45);background:rgba(245,211,168,.06);box-shadow:0 0 0 1px rgba(245,211,168,.18),0 10px 40px rgba(245,211,168,.08)}
.page{display:none}.page.on{display:block}
.head{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.head h1{margin:0;font-size:24px;font-weight:700;letter-spacing:-.01em}
.head h2{margin:0;font-size:15px;font-weight:700}
.meta{color:var(--text2);margin-top:8px;font-size:13px;line-height:1.5}
.sec-t{font-size:11px;font-weight:600;color:var(--text3);text-transform:uppercase;letter-spacing:.07em;margin:16px 0 8px}
.big{font-size:30px;font-weight:700;letter-spacing:-.02em;line-height:1.1}
.big small{font-size:13px;color:var(--text2);font-weight:500;letter-spacing:0}
.empty{color:var(--text2);text-align:center;padding:40px 20px;line-height:1.6}
.warn{padding:10px 12px;border-radius:10px;background:rgba(255,159,10,.08);border:1px solid rgba(255,159,10,.35);line-height:1.5;margin-top:12px}
.banner{margin:14px 20px 0;padding:10px 14px;border-radius:10px;background:rgba(255,159,10,.1);border:1px solid rgba(255,159,10,.4);line-height:1.5;max-width:1460px}
.banner.demo{background:rgba(91,140,255,.12);border-color:rgba(91,140,255,.4);display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.tbl{width:100%;border-collapse:collapse}
.tbl th{font-size:11px;font-weight:600;color:var(--text3);text-align:left;padding:6px 8px;border-bottom:1px solid var(--stroke2);white-space:nowrap}
.tbl td{padding:7px 8px;border-bottom:1px solid var(--stroke);vertical-align:middle}
.tbl tr:last-child td{border-bottom:none}
.tbl td.num{font-weight:700;font-variant-numeric:tabular-nums;color:var(--accent);width:52px;font-size:14px}
.tbl td.t{font-weight:700;font-variant-numeric:tabular-nums;width:60px;font-size:14px}
.tbl tr.cur td{background:rgba(245,211,168,.07)}
.tbl tr.next td{background:rgba(91,140,255,.07)}
.tbl tr.past td{opacity:.55}
.tbl tr.absent td.nm{color:var(--text2)}
.catchip{display:inline-block;font-size:11px;font-weight:600;padding:2px 7px;border-radius:6px;background:var(--glass2);color:var(--text2);margin:1px 3px 1px 0;white-space:nowrap}
.catchip.floor{background:rgba(52,199,89,.16);color:#5fe08a}
.catchip.out{opacity:.45;text-decoration:line-through}
.srow{display:flex;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--stroke)}
.srow:first-child{border-top:none}
.srow .tm{font-weight:700;font-variant-numeric:tabular-nums;width:44px}
.srow .tt{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.srow.cur .tt{font-weight:700;color:var(--accent)}
.srow.past{opacity:.5}
.trow{padding:10px 0;border-top:1px solid var(--stroke);cursor:pointer}
.trow:first-child{border-top:none}
.trow p{margin:5px 0 3px;line-height:1.4}
.kan{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;align-items:start}
@media(max-width:980px){.kan{grid-template-columns:1fr}}
.kcol{background:rgba(255,255,255,.025);border:1px solid var(--stroke);border-radius:14px;padding:12px;min-height:160px}
.kcol h3{margin:0 0 10px;font-size:12px;font-weight:600;color:var(--text3);text-transform:uppercase;letter-spacing:.07em;display:flex;gap:6px;align-items:center}
.tcard{background:var(--glass);border:1px solid var(--stroke);border-radius:12px;padding:12px;margin-top:8px;box-shadow:0 4px 16px rgba(0,0,0,.2)}
.tcard.urgent{border-color:rgba(255,90,95,.6);background:rgba(255,90,95,.08)}
.tcard.done{opacity:.6}
.tcard p{margin:8px 0 6px;font-size:14px;line-height:1.45}
.tcard .who{font-size:11px;color:var(--text2);line-height:1.5}
.tcard .acts{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.toasts{position:fixed;left:20px;bottom:20px;z-index:80;display:flex;flex-direction:column-reverse;gap:8px;width:320px;max-width:calc(100% - 40px);pointer-events:none}
.toast{pointer-events:auto;padding:11px 14px;border-radius:12px;background:#3a1420;border:1px solid rgba(255,90,95,.55);color:#ffd5d6;box-shadow:0 12px 30px rgba(0,0,0,.45);font-size:13px;line-height:1.45;cursor:pointer;animation:pop .18s}
.toast.ok{background:#0f2e1c;border-color:rgba(52,199,89,.55);color:#c8f5d6}
.toast b{display:block;margin-bottom:2px}
.backdrop{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.45);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);display:flex;align-items:center;justify-content:center;padding:20px;animation:fade .15s}
.modal{width:min(520px,100%);max-height:90vh;overflow:auto;background:#151a52;border:1px solid var(--stroke2);border-radius:16px;box-shadow:0 30px 80px rgba(0,0,0,.5);animation:pop .18s}
.modal .mh{padding:16px 18px 6px;font-size:16px;font-weight:700}
.modal .mb{padding:0 18px 6px}
.modal .mf{display:flex;gap:8px;justify-content:flex-end;padding:14px 18px;border-top:1px solid var(--stroke);margin-top:12px}
.mrow{display:flex;align-items:center;gap:8px;padding:10px 8px;border-top:1px solid var(--stroke);cursor:pointer;border-radius:10px}
.mrow:hover{background:var(--glass2)}
.mrow.cur{background:rgba(91,140,255,.12)}
.mrow b{display:block}.mrow small{color:var(--text3);font-size:11px}
.qrbox{display:flex;justify-content:center;padding:10px;background:#fff;border-radius:12px;margin:12px auto 4px;width:fit-content}
.qrbox svg{display:block;width:220px;height:220px}
#boot{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;color:var(--text2);line-height:1.6;padding:20px}
</style>
</head>

const store = { get(k){ try { return localStorage.getItem(k); } catch { return null; } }, set(k,v){ try { localStorage.setItem(k,v); } catch {} } };
const fmtTime = ms => ms ? new Date(ms).toLocaleTimeString("cs-CZ", { hour:"2-digit", minute:"2-digit" }) : "–";
const hm2min = t => { const m = /^(\d{1,2}):(\d{2})$/.exec(t || ""); return m ? +m[1] * 60 + +m[2] : null; };

const norm = s => String(s ?? "").normalize("NFD").replace(/[\u0300-\u036f]/g, "").toLowerCase();     // hledání bez diakritiky

// ---------- živý režim: Firebase (samostatně pojmenovaná aplikace = vlastní cache i přihlášení) ----------
const Live = {
  async init() {
    const [A, U, F] = await Promise.all([import(FB + "firebase-app.js"), import(FB + "firebase-auth.js"), import(FB + "firebase-firestore.js")]);
    const app = A.initializeApp(firebaseConfig, "artimo-sprava");
    const auth = U.getAuth(app);
    try { this.db = F.initializeFirestore(app, { localCache: F.persistentLocalCache({ tabManager: F.persistentMultipleTabManager() }) }); }
    catch { this.db = F.initializeFirestore(app, { localCache: F.memoryLocalCache() }); }
    this.F = F;
    await new Promise((res, rej) => { U.onAuthStateChanged(auth, u => { if (u) res(); }); U.signInAnonymously(auth).catch(rej); });
  },
  ref(path) { const p = path.split("/"); return p.length % 2 === 0 ? this.F.doc(this.db, ...p) : this.F.collection(this.db, ...p); },
  conv(v) { if (v === DEL) return this.F.deleteField(); if (Array.isArray(v) || v === null || typeof v !== "object") return v; return Object.fromEntries(Object.entries(v).map(([k, x]) => [k, this.conv(x)])); },
  watchDoc(path, cb, onErr) { return this.F.onSnapshot(this.ref(path), { includeMetadataChanges: true }, s => cb(s.exists() ? s.data() : null, { fromCache: s.metadata.fromCache }), onErr); },
  watchCol(path, cb, onErr) { return this.F.onSnapshot(this.ref(path), { includeMetadataChanges: true }, s => cb(s.docs.map(d => ({ id: d.id, ...d.data() })), { fromCache: s.metadata.fromCache }), onErr); },
  async getCol(path) { return (await this.F.getDocs(this.ref(path))).docs.map(d => ({ id: d.id, ...d.data() })); },
  set(path, data) { guard(path); return this.F.setDoc(this.ref(path), this.conv(data), { merge: true }); },
  del(path) { guard(path); return this.F.deleteDoc(this.ref(path)); }
};

// ---------- ukázkový režim: data jen v tomto prohlížeči (sdílená mezi kartami) ----------
const Demo = {
  key: "am_demo_v1", docs: {}, subs: new Set(),
  async init() {
    this.load(); if (!Object.keys(this.docs).length) { this.docs = demoSeed(); this.save(); }
    // změny si karty posílají přímo (localStorage se mezi kartami propisuje se zpožděním)
    try { this.bc = new BroadcastChannel(this.key); this.bc.onmessage = e => { const m = e.data || {};
      if (m.all) this.docs = m.all; else if (m.doc === null) delete this.docs[m.path]; else if (m.path) this.docs[m.path] = m.doc;
      this.save(true); this.notify(); }; }
    catch { addEventListener("storage", e => { if (e.key === this.key) { this.load(); this.notify(); } }); }
  },
  load() { try { this.docs = JSON.parse(localStorage.getItem(this.key) || "{}"); } catch { this.docs = {}; } },
  save(quiet) { try { localStorage.setItem(this.key, JSON.stringify(this.docs)); } catch {} },
  post(m) { try { this.bc?.postMessage(m); } catch {} },
  notify() { for (const f of [...this.subs]) f(); },
  reset() { this.docs = demoSeed(); this.save(); this.post({ all: this.docs }); this.notify(); },
  merge(a, b) { for (const [k, v] of Object.entries(b)) { if (v && v.__del) delete a[k]; else if (v && typeof v === "object" && !Array.isArray(v)) a[k] = this.merge(a[k] && typeof a[k] === "object" && !Array.isArray(a[k]) ? a[k] : {}, v); else a[k] = v; } return a; },
  sub(f) { this.subs.add(f); setTimeout(f, 0); return () => this.subs.delete(f); },
  watchDoc(path, cb) { return this.sub(() => cb(this.docs[path] ? JSON.parse(JSON.stringify(this.docs[path])) : null, { fromCache: false })); },
  colOf(path) { return Object.entries(this.docs).filter(([k]) => k.startsWith(path + "/") && !k.slice(path.length + 1).includes("/")).map(([k, v]) => ({ id: k.slice(path.length + 1), ...JSON.parse(JSON.stringify(v)) })); },
  watchCol(path, cb) { return this.sub(() => cb(this.colOf(path), { fromCache: false })); },
  async getCol(path) { return this.colOf(path); },
  set(path, data, raw) { if (!raw) guard(path); this.docs[path] = this.merge(this.docs[path] || {}, JSON.parse(JSON.stringify(data))); this.save(); this.post({ path, doc: this.docs[path] }); this.notify(); return Promise.resolve(); },
  del(path) { guard(path); delete this.docs[path]; this.save(); this.post({ path, doc: null }); this.notify(); return Promise.resolve(); }
};

function catState(cid) {
  const rs = roundsOf(cid);
  const open = rs.filter(r => r.status === "open").pop(); if (open) return { code: "open", text: "Probíhá · " + open.label };
  const lk = rs.filter(r => r.status === "locked").pop(); if (lk) return { code: "locked", text: "Vyhodnocuje se · " + lk.label };
  if (!rs.length) return { code: "wait", text: "Čeká" };
  const last = rs[rs.length - 1];
  return last.type === "final" ? { code: "done", text: "Dokončeno" } : { code: "between", text: "Mezi koly · po: " + last.label };
}
// Tanec: sčitatel potvrzuje převzetí lístků do kola (acks). První tanec, kde ještě nejsou všechny lístky, právě běží.
function danceProgress(r) { const js = r.judges || []; return (r.dances || []).map(d => ({ d, n: js.filter(j => (r.acks?.[`${d}_${j}`] || 0) > 0).length, of: js.length })); }

  for (const c of S.cats) { states[c.id] = catState(c.id); const rs = roundsOf(c.id); if (rs.length) starts[c.id] = rs[0].created || null; }
  let run = null;
  if (r) { const dp = danceProgress(r); run = { cid: r.categoryId, cat: r.category || catById(r.categoryId)?.name || "", label: r.label || "", type: r.type, status: r.status, dances: dp,
    cur: r.status === "open" ? (dp.find(x => x.n < x.of)?.d || null) : null, couples: r.couples || [], judges: (r.judges || []).length, started: r.created || null }; }

function nextIndex(now) {

  if (last >= 0 && now.states[sc[last].cid].code === "between") return last;       // kategorie čeká na další kolo
  let i = last + 1; const nm = dayMin(Date.now());

function demoStep() {

// ---------- modální okno ----------
function modal(title, body, buttons, onOpen) {
  return new Promise(resolve => {
    const root = $("modalRoot");
    root.innerHTML = `<div class="backdrop"><div class="modal"><div class="mh">${title}</div><div class="mb">${body}<div class="err merr"></div></div>
      <div class="mf">${buttons.map((b, i) => `<button class="btn ${b.cls || ""}" data-i="${i}">${b.label}</button>`).join("")}</div></div></div>`;
    const box = root.querySelector(".backdrop"); let closed = false;
    const close = v => { if (closed) return; closed = true; root.innerHTML = ""; resolve(v); };
    box.addEventListener("mousedown", e => { if (e.target === box) close(null); });
    box.querySelectorAll("[data-i]").forEach(btn => btn.onclick = () => {
      const b = buttons[+btn.dataset.i];
      if (!b.action) return close(b.value ?? null);
      try { const r = b.action(root); if (r === false) return; close(r ?? true); } catch (e) { box.querySelector(".merr").textContent = errText(e); }
    });
    root.close = close;
    try { onOpen?.(root); } catch (e) { toast("Chyba", errText(e)); }
    box.querySelector("input.in,textarea.in")?.focus();
  });
}

      const text = r.querySelector("#tText").value.trim(); if (!text) throw new Error("Napište popis úkolu.");
      const who = r.querySelector("#tWho").value, n = parseInt(r.querySelector("#tN").value, 10) || null;
      saveTask(newId(), { type, urgent: r.querySelector("#tUrg").checked, text, n, status: who ? "wip" : "new", by: ME, byId: deviceId, at: Date.now(), ...(who ? { taker: who, takenAt: Date.now() } : {}) });
    } }], r => r.querySelectorAll("#tType .chip").forEach(b => b.onclick = () => { type = b.dataset.k; r.querySelectorAll("#tType .chip").forEach(x => x.classList.toggle("on", x === b)); }));
}
function assignModal(id) {
  const t = S.tasks.find(x => x.id === id); if (!t) return;
  modal("Přidělit úkol", `<p class="hint" style="margin-top:0">${esc(t.text)}</p><label class="lbl">Kdo to vyřeší</label><select class="in" id="aWho">${helperOpts(t.taker || "")}</select>`,
    [{ label: "Zrušit" }, { label: "Přidělit", cls: "primary", action: r => { const who = r.querySelector("#aWho").value;
      saveTask(id, who ? { status: "wip", taker: who, takenAt: Date.now() } : { status: "new", taker: DEL, takenAt: DEL }); } }]);
}
async function helperLinkModal() {
  const base = location.href.split("?")[0].replace(/vedouci(\.html|\/(index\.html)?)?$/, m => m.replace("vedouci", "pomocnik"));
  const url = `${base}?c=${encodeURIComponent(S.comp)}${DEMO ? "&demo=1" : ""}`;
  modal("Odkaz pro pomocníky", `<p class="hint" style="margin-top:0">Pomocník si odkaz otevře v telefonu, zadá jméno a stanoviště. Zapisuje prezenci a hlásí problémy.</p>
    <div class="row"><input class="in" id="hlUrl" readonly value="${esc(url)}"><button class="btn" id="hlCopy">Kopírovat</button></div><div id="hlQr"></div>`, [{ label: "Zavřít", cls: "primary" }], r => {
      r.querySelector("#hlCopy").onclick = async () => { try { await navigator.clipboard.writeText(url); toast("Zkopírováno", "", "ok"); } catch { r.querySelector("#hlUrl").select(); } };
      const draw = () => { try { const q = qrcode(0, "M"); q.addData(url); q.make(); const el = r.querySelector("#hlQr"); if (el) el.innerHTML = `<div class="qrbox">${q.createSvgTag({ cellSize: 4, margin: 0, scalable: true })}</div>`; } catch {} };
      if (window.qrcode) draw(); else { const s = document.createElement("script"); s.src = "https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.js"; s.onload = draw; document.head.appendChild(s); }
    });
}
async function compModal() {
  let list = []; try { list = await B.getCol("competitions"); } catch (e) { return toast("Seznam soutěží se nenačetl", errText(e)); }
  list.sort((a, b) => (b.startedAt || b.createdAt || 0) - (a.startedAt || a.createdAt || 0));
  modal("Soutěž", `<p class="hint" style="margin-top:0">Soutěže zakládá sčitatel. Zde se jen vybírá, kterou sledovat.</p>
    <div>${list.map(c => `<div class="mrow ${c.id === S.comp ? "cur" : ""}" data-c="${esc(c.id)}"><div class="grow"><b>${esc(c.name || c.id)}</b><small>${esc(c.id)}${c.test ? " · zkušební" : ""}</small></div><span class="badge ${c.finishedAt ? "done" : c.startedAt ? "open" : "wait"}">${c.finishedAt ? "Ukončená" : c.startedAt ? "Probíhá" : "Připravená"}</span></div>`).join("") || `<div class="muted">V databázi není žádná soutěž.</div>`}</div>`,
    [{ label: "Zavřít" }], r => r.querySelectorAll("[data-c]").forEach(el => el.onclick = () => { $("modalRoot").close(); startComp(el.dataset.c); }));
}

// ---------- ovládání ----------
document.addEventListener("click", async e => {
  const el = e.target.closest("[data-act]"); if (!el) return;
  const a = el.dataset.act, i = +el.dataset.i, id = el.dataset.id, sc = [...sched()];
  if (a === "goPlan") return showPage("plan");
  if (a === "goList") return showPage("list");
  if (a === "goTasks") return showPage("tasks");
  if (a === "demoStep") { const m = demoStep(); if (m) toast("Ukázka", m, "ok"); return; }
  if (a === "demoReset") return Demo.reset();
  if (a === "helperLink") return helperLinkModal();
  if (a === "newTask") return newTaskModal();
  if (a === "planAdd") return planItemModal(null);
  if (a === "planEdit") return planItemModal(i);
  if (a === "planGen") return planGenModal();
  if (a === "planSort") return saveSched(sc.sort((x, y) => (hm2min(x.t) ?? 1e9) - (hm2min(y.t) ?? 1e9)));
  if (a === "planUp" && i > 0) { [sc[i - 1], sc[i]] = [sc[i], sc[i - 1]]; return saveSched(sc); }
  if (a === "planDown" && i < sc.length - 1) { [sc[i + 1], sc[i]] = [sc[i], sc[i + 1]]; return saveSched(sc); }
  if (a === "planDel") { if (await confirmBox(`Smazat položku <b>${esc(itemTitle(sc[i]))}</b> z harmonogramu?`, "Smazat", "danger")) { const arr = sched().filter(x => x.id !== sc[i].id); saveSched(arr); } return; }
  if (a === "prez") { const n = +el.dataset.n; if (S.prez[n] && !await confirmBox(`Zrušit přítomnost čísla <b>${n}</b> ${esc(nameOf(n))}?`, "Zrušit přítomnost", "danger")) return; return setPresent(n, !S.prez[n], ME); }
  if (a === "tTake") return saveTask(id, { status: "wip", taker: ME, takenAt: Date.now() });
  if (a === "tDone") return saveTask(id, { status: "done", doneAt: Date.now(), doneBy: ME });
  if (a === "tBack") return saveTask(id, { status: "new", taker: DEL, takenAt: DEL, doneAt: DEL, doneBy: DEL });
  if (a === "tAssign") return assignModal(id);
  if (a === "tDel") { if (await confirmBox("Smazat vyřešený úkol?", "Smazat", "danger")) wr(B.del(`${opsPath()}/tasks/${id}`), "Úkol se nesmazal"); return; }
});
function showPage(p) { page = p; document.querySelectorAll("#pageSeg button").forEach(b => b.classList.toggle("on", b.dataset.page === p)); document.querySelectorAll(".page").forEach(x => x.classList.toggle("on", x.id === "page-" + p)); draw(); }
$("pageSeg").onclick = e => { const b = e.target.closest("[data-page]"); if (b) showPage(b.dataset.page); };
$("listSeg").onclick = e => { const b = e.target.closest("[data-f]"); if (!b) return; listF = b.dataset.f; document.querySelectorAll("#listSeg button").forEach(x => x.classList.toggle("on", x === b)); draw(); };
$("listQ").oninput = draw; $("listCat").onchange = draw; $("compBtn").onclick = compModal;
const tick = () => { $("clock").textContent = new Date().toLocaleTimeString("cs-CZ", { hour: "2-digit", minute: "2-digit" }); };
setInterval(() => { tick(); if (!$("modalRoot").innerHTML && page === "over") draw(); }, 20000); tick();

// ---------- start ----------
(async function boot() {
  try { await initBackend(); }
  catch (e) { $("bootMsg").innerHTML = `<span style="color:#ff8a8d">Nepodařilo se připojit k Firebase: ${esc(errText(e))}</span><br><br><button class="btn primary" onclick="location.reload()">Zkusit znovu</button> <button class="btn" onclick="location.search='?demo=1'">Otevřít ukázku</button>`; return; }
  $("boot").remove(); $("hdr").classList.remove("hidden"); $("app").classList.remove("hidden"); $("demoTag").classList.toggle("hidden", !DEMO);
  let id = DEMO ? "ukazka" : params.get("c") || store.get("am_comp");
  if (!id) { try { const l = await B.getCol("competitions"); const live = l.filter(c => c.startedAt && !c.finishedAt).sort((a, b) => (a.test ? 1 : 0) - (b.test ? 1 : 0) || b.startedAt - a.startedAt);
    id = (live[0] || l.filter(c => !c.finishedAt).sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0))[0] || l[0])?.id; } catch {} }
  if (!id) { setConn("wait", "Bez soutěže"); return compModal(); }
  startComp(id);
})();
</script>
</body>
</html>
